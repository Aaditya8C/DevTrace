spring:
  application:
    name: devtrace-backend
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${devtrace.frontend-url}/login/oauth2/code/github
            scope:
              - read:user
              - repo

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

devtrace:
  temp-directory: ${java.io.tmpdir}/devtrace/repos
  frontend-url: ${DEVTRACE_FRONTEND_URL}

ai:
  primary-provider: gemini
  fallback-order:
    - openrouter
    - ollama
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    model: ${OPENROUTER_MODEL:deepseek/deepseek-r1}
    url: ${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434/v1/chat/completions}
    model: ${OLLAMA_MODEL:llama3}
    enabled: ${OLLAMA_ENABLED:false}

